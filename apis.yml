name: FBG Capital
description: 'FBG Capital is a digital asset management firm operating in blockchain-based capital
  markets, founded in 2015 by Vincent Zhou. One of the earliest and largest blockchain-focused
  investment firms in Asia, FBG runs a venture arm that backs early-stage blockchain and Web3
  startups and a trading/asset-management arm active across cryptocurrency markets. Its portfolio
  spans DeFi, Layer-1 and Layer-2 protocols, gaming, metaverse, and infrastructure projects
  (Terra, NEAR, Livepeer, Filecoin, Maple, Origin Protocol, Zilliqa, and many others). FBG Capital
  publishes no public API, developer portal, or SDKs; this profile tracks the firm as a
  company/investor node in the API Evangelist network.'
